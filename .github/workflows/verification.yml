name: redcn verification
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: node scripts/check-secrets.mjs
      - run: python -m pip install -r cli/requirements-browser.txt -r cli/requirements-media.txt -r cli/requirements-cloud.txt openpyxl
      - run: python -m playwright install --with-deps chrome
      - run: npm run build
      - name: Validate roadmap structure and existing evidence
        run: python scripts/validate-roadmap-evidence.py --output "$RUNNER_TEMP/redcn-roadmap-audit.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: redcn-roadmap-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/redcn-roadmap-audit.json
          if-no-files-found: warn
          retention-days: 14
      - run: npm test
      - run: npm run validate && npm run validate:pages
      - run: python scripts/run-browser-regression.py
      - run: python scripts/run-python-partition.py --verify-only
  python:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r cli/requirements-browser.txt -r cli/requirements-media.txt -r cli/requirements-cloud.txt openpyxl
      - run: python -m playwright install --with-deps chrome
      - run: npm run build
      - run: python scripts/run-python-partition.py --part ${{ matrix.part }} --parts 4

  mac-portability:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r cli/requirements-media.txt
      - name: Restore source Mac fixture on a fresh hosted Mac
        run: python scripts/portable-mac-proof.py verify --fixture tests/fixtures/macos-portability --require-github-macos --receipt-output "$RUNNER_TEMP/redcn-portability-destination.json"
      - name: Restore learning decisions and synthetic weight versions from the source Mac
        run: python scripts/portable-mac-proof.py verify --fixture tests/fixtures/macos-learning-v29 --require-github-macos --receipt-output "$RUNNER_TEMP/redcn-learning-destination.json"
      - uses: actions/upload-artifact@v7
        with:
          name: redcn-other-mac-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/redcn-portability-destination.json
            ${{ runner.temp }}/redcn-learning-destination.json
          if-no-files-found: error
          retention-days: 14
  sites-release-artifact:
    needs: [verify, python, mac-portability]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REDCN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REDCN_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm run build
      - run: python scripts/sites-release-artifact.py --source-sha "$REDCN_SOURCE_SHA" --run-id "$GITHUB_RUN_ID" --output "$RUNNER_TEMP/redcn-sites-release"
      - uses: actions/upload-artifact@v7
        with:
          name: redcn-sites-${{ env.REDCN_SOURCE_SHA }}
          path: ${{ runner.temp }}/redcn-sites-release/
          if-no-files-found: error
          retention-days: 14
